<!doctype html>
<!-- The DMG window's background, 660×400. make_dmg.py puts the icons on it: the app centred at
     (165, 230), Applications at (495, 230). Colours are the app's light theme (src/styles.css). -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body { background: linear-gradient(#ffffff, #ececef); color: #1d1d1f; font-family: -apple-system, "SF Pro Text", sans-serif; position: relative; }
  .mark { position: absolute; left: 50%; top: 22px; width: 48px; height: 48px; transform: translateX(-50%); }
  .name { position: absolute; top: 74px; width: 100%; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
  .tag { position: absolute; top: 106px; width: 100%; text-align: center; font-size: 14px; color: #6e6e73; }
  .arrow { position: absolute; left: 250px; top: 206px; width: 160px; height: 48px; }
  .hint { position: absolute; top: 336px; width: 100%; text-align: center; font-size: 14px; color: #6e6e73; }
  .hint b { font-weight: 600; color: #1d1d1f; }
</style>
<body>
  <!-- The app icon, as in index.html's splash. -->
  <svg class="mark" viewBox="100 100 824 824" aria-hidden="true">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2f2f33" /><stop offset="1" stop-color="#17171a" />
      </linearGradient>
    </defs>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sg)" />
    <rect x="212" y="212" width="348" height="600" rx="22" fill="#d7263d" />
    <rect x="264" y="330" width="244" height="430" rx="18" fill="#e8590c" />
    <rect x="308" y="426" width="156" height="290" rx="14" fill="#d99a00" />
    <rect x="582" y="212" width="230" height="328" rx="22" fill="#1a9e4b" />
    <rect x="582" y="562" width="118" height="250" rx="22" fill="#0e9aa7" />
    <rect x="722" y="562" width="90" height="250" rx="22" fill="#1e7fe0" />
  </svg>
  <div class="name">Disk Usage</div>
  <div class="tag">See what is using your disk: every folder a block, sized by what it takes up</div>
  <svg class="arrow" viewBox="0 0 160 48" fill="none" stroke="#0a66c2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 24 H146" /><path d="M126 8 L148 24 L126 40" />
  </svg>
  <div class="hint">Drag <b>Disk Usage</b> onto <b>Applications</b> to install it</div>
</body>
