<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disk Usage</title>
    <!--
      Inline splash: no stylesheet, no JS bundle, no cache read in the way, so it paints as soon
      as the webview does and covers the wait for the real UI. Rust shows the window itself
      (lib.rs) already carrying the theme colour, so there is no white flash.
      Keep the two background colours in step with --bg in src/styles.css and lib.rs.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --splash-bg: #f5f5f7;
        --splash-fg: #1d1d1f;
        --splash-dim: #6e6e73;
        --splash-line: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #1e1e20;
          --splash-fg: #f2f2f4;
          --splash-dim: #9a9aa2;
          --splash-line: rgba(255, 255, 255, 0.1);
        }
      }
      html, body { background: var(--splash-bg); margin: 0; }
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: var(--splash-bg);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: var(--splash-fg);
        transition: opacity 0.18s ease-out;
      }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .mark { width: 68px; height: 68px; animation: rise 0.35s ease-out both; }
      #splash .name { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
      #splash .what { font-size: 12px; color: var(--splash-dim); margin-top: -8px; }
      #splash .bar { width: 152px; height: 3px; border-radius: 99px; background: var(--splash-line); overflow: hidden; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: #1e7fe0; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
      @keyframes rise { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash .mark, #splash .bar i { animation: none; } }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="splash">
      <!-- The app icon (design/icon.png, drawn by tools/make_icons.py) in SVG: dark tile, treemap blocks. -->
      <svg class="mark" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2f2f33" /><stop offset="1" stop-color="#17171a" />
          </linearGradient>
        </defs>
        <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sg)" />
        <rect x="212" y="212" width="348" height="600" rx="22" fill="#d7263d" />
        <rect x="264" y="330" width="244" height="430" rx="18" fill="#e8590c" />
        <rect x="308" y="426" width="156" height="290" rx="14" fill="#d99a00" />
        <rect x="582" y="212" width="230" height="328" rx="22" fill="#1a9e4b" />
        <rect x="582" y="562" width="118" height="250" rx="22" fill="#0e9aa7" />
        <rect x="722" y="562" width="90" height="250" rx="22" fill="#1e7fe0" />
      </svg>
      <div class="name">Disk Usage</div>
      <div class="what">Reading the last scan…</div>
      <div class="bar"><i></i></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
